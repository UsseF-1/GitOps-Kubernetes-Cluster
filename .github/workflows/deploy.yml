name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1
  ECR_VOTE: 569033310103.dkr.ecr.us-east-1.amazonaws.com/voting-app-vote
  ECR_RESULT: 569033310103.dkr.ecr.us-east-1.amazonaws.com/voting-app-result
  ECR_WORKER: 569033310103.dkr.ecr.us-east-1.amazonaws.com/voting-app-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Vote Image
        run: |
          docker build \
            -t $ECR_VOTE:${{ github.sha }} \
            -t $ECR_VOTE:latest \
            -f docker/vote/dockerfile.Dockerfile docker/vote

      - name: Build Result Image
        run: |
          docker build \
            -t $ECR_RESULT:${{ github.sha }} \
            -t $ECR_RESULT:latest \
            -f docker/result/dockerfile.Dockerfile docker/result

      - name: Build Worker Image
        run: |
          docker build \
            -t $ECR_WORKER:${{ github.sha }} \
            -t $ECR_WORKER:latest \
            -f docker/worker/dockerfile.Dockerfile docker/worker

      - name: Scan Vote Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_VOTE }}:${{ github.sha }}
          exit-code: '0'
          severity: CRITICAL

      - name: Scan Result Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_RESULT }}:${{ github.sha }}
          exit-code: '0'
          severity: CRITICAL

      - name: Scan Worker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_WORKER }}:${{ github.sha }}
          exit-code: '0'
          severity: CRITICAL

      - name: Push Vote Image
        run: |
          docker push $ECR_VOTE:${{ github.sha }}
          docker push $ECR_VOTE:latest

      - name: Push Result Image
        run: |
          docker push $ECR_RESULT:${{ github.sha }}
          docker push $ECR_RESULT:latest

      - name: Push Worker Image
        run: |
          docker push $ECR_WORKER:${{ github.sha }}
          docker push $ECR_WORKER:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name voting-cluster

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm upgrade
        run: |
          helm upgrade --install voting-app ./helm-chart \
            --set vote.image.tag=${{ github.sha }} \
            --set result.image.tag=${{ github.sha }} \
            --set worker.image.tag=${{ github.sha }}

      - name: Verify pods are running
        run: kubectl get pods

